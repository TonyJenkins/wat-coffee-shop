<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Drinks — Coffee Shop</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    {% load static %}
    <link rel="stylesheet" href="{% static 'drinks_counter/index.css' %}">
</head>
<body>
<main class="page">
    <article class="card" role="main" aria-labelledby="drinks-title">
        <header>
            <h1 id="drinks-title">All Drinks</h1>
            <p class="meta">List of drinks available in the coffee shop.</p>
        </header>
        <section class="content" aria-describedby="drinks-desc">
            <div id="drinks-list" class="drinks-list" role="list">
                <div class="placeholder">
                    {% if drinks %}
                        <ul id="drinks-list" class="drinks-list" role="list">
                            {% for drink in drinks %}
                                <li role="listitem" class="drink-item">
                                    <a href="{% url 'drinks_counter:drink_display' drink.slug %}">{{ drink.name }} — £{{ drink.price }}</a>
                                </li>
                            {% endfor %}
                        </ul>
                    {% else %}
                        <div id="drinks-list" class="drinks-list placeholder">
                            No drinks found.
                        </div>
                    {% endif %}
                </div>
            </div>
        </section>
    </article>
</main>
</body>
</html>
